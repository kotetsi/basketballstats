<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Format Library · basketballstats.eu</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<style>
main{display:block;height:auto}
.wrap{max-width:1280px;margin:0 auto;padding:18px 24px 80px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{background:transparent;color:var(--mut);border-color:var(--line)}.tabs button.on{color:var(--ink);background:var(--chip)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fcard h4{margin:0;font-size:16px}.fcard .num{color:var(--mut);font-weight:700;margin-right:6px}
.st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--chip)}
.st.available{color:var(--ok)}.st.planned{color:var(--warn)}.st.missing-data,.st.insufficient{color:var(--bad)}.st.disabled{color:var(--mut)}
.small{font-size:12px;color:var(--mut)}.miss{font-size:12px;color:var(--bad)}
.fam{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.req{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.score{font-size:22px;font-weight:800}.comp{font-size:11px;color:var(--mut)}
.seg{font-size:13px;margin:3px 0}.seg b{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px}
.day.game{border-color:var(--acc)}.day h5{margin:0 0 6px;font-size:12px}.slot{font-size:12px;background:var(--chip);border-radius:6px;padding:5px 7px;margin:4px 0}.slot.man{outline:1px dashed var(--acc2)}
.slot small{display:block;color:var(--mut)}
dialog .row label{flex:1}
</style>
</head>
<body>
<header><div class="brand">FORMAT <i>LIBRARY</i> <span>basketballstats.eu</span></div><div id="meta" class="meta"></div><a href="/"><button class="ghost sm">← Video Factory</button></a></header>
<div class="wrap">
  <nav class="tabs"><button data-t="lib" class="on">Library</button><button data-t="cal">Editorial calendar</button><button data-t="perf">Performance</button><button data-t="data">Datasets</button></nav>
  <section id="view"></section>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row end"><button class="ghost" id="dlgClose">Close</button></div></dialog>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/formats.js"></script>
</body>
</html>
