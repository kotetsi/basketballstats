# Καθημερινή ρουτίνα social: «Στατιστικό της ημέρας» (από τους αγώνες της προηγούμενης βραδιάς) και ένα pick του High Fidelity
# για τους αγώνες της ημέρας, σε κάθε συνδεδεμένο δίκτυο (Facebook, Instagram, Threads, Telegram, Bluesky, X, Viber).
# Ένα δίκτυο χωρίς secrets απλώς παραλείπεται. Τίποτα δεν αναρτάται δύο φορές (data/daily-social.json).
name: Social καθημερινά
on:
  schedule:
    - cron: "10 10 * * *"   # 12:10 ώρα Ελλάδας τον χειμώνα: στατιστικό της ημέρας + pick
    - cron: "10 16 * * *"   # 18:10: pick της ημέρας αν το High Fidelity το ανέβασε αργότερα
  workflow_dispatch:
    inputs:
      only:
        description: "Μόνο stat ή μόνο pick (κενό = και τα δύο)"
        required: false
        default: ""
      plan:
        description: "Ανάρτηση έτοιμου plan που είναι ήδη στο repo (π.χ. social/daily/test-2026-11-20/plan.json) χωρίς prepare (κενό = κανονικά)"
        required: false
        default: ""
      dry:
        description: "Δοκιμή: φτιάχνει κάρτες/βίντεο αλλά δεν αναρτά (1 = ναι)"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: social
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Εργαλεία (Chromium, ffmpeg)
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          which ffmpeg || (sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends ffmpeg)
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Στατιστικό και pick της ημέρας (κάρτες + βίντεο)
        env:
          DAILY_ONLY: ${{ inputs.only }}
        if: ${{ !inputs.plan }}
        run: node scripts/daily-social.mjs prepare
      - name: Δημοσίευση των εικόνων στο repo (δημόσιο URL για Instagram/Threads/Viber)
        run: |
          git config user.name "basketballstats-bot"; git config user.email "basketballstats-bot@users.noreply.github.com"
          git add social/daily
          git diff --cached --quiet || (git commit -m "Social: υλικό ημέρας $(date -u +%F)" && for i in 1 2 3 4; do git push && break; sleep 10; git pull --rebase -q; done)
          sleep 20
      - name: Αναρτήσεις
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: "1372786612592081"
          IG_USER_ID: "17841438627851733"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: "@eubasketballstats_eu"
          BSKY_HANDLE: "basketballstatseu.bsky.social"
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          VIBER_CHANNEL_TOKEN: ${{ secrets.VIBER_CHANNEL_TOKEN }}
          SOCIAL_DRY: ${{ inputs.dry == '1' && '1' || '0' }}
          SOCIAL_PLAN: ${{ inputs.plan }}
        run: node scripts/daily-social.mjs post
      - name: Αποθήκευση (τι αναρτήθηκε)
        if: always()
        run: |
          git add data/daily-social.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Social: αναρτήσεις ημέρας" && for i in 1 2 3 4; do git push && break; sleep 10; git pull --rebase -q; done)
