name: Historical moneyline coverage audit
on:
  push:
    branches: [research/historical-odds-probe]
    paths: ['.github/workflows/historical-odds-coverage.yml']
permissions:
  contents: read
jobs:
  coverage:
    if: github.repository == 'kotetsi/basketballstats' && github.ref == 'refs/heads/research/historical-odds-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check historical moneyline coverage
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/historical-odds-coverage.mjs
