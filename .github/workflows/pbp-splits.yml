# Ατομικά splits για τα props (ανά περίοδο, με/χωρίς συμπαίκτη): ξαναεπεξεργασία του play-by-play των αγώνων
# που δεν τα έχουν ακόμα. Χειροκίνητα, σε δόσεις (συνεχίζει από όπου σταμάτησε).
name: PBP splits (props)
on:
  workflow_dispatch:
    inputs:
      season: { description: 'Σεζόν (κενό = τρέχουσα)', default: '' }
permissions:
  contents: write
concurrency: { group: pbp-splits, cancel-in-progress: false }
jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/pbp.mjs --splits --secs 2100 --max 500 ${{ inputs.season && format('--season {0}', inputs.season) || '' }}
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/pbp
          git diff --cached --quiet || (git commit -m "PBP: ατομικά splits για τα props" && for i in 1 2 3; do git push && break; sleep 10; git pull --rebase -q; done)
