# NBA: αποδόσεις (νικητής, χάντικαπ, σύνολο) από το The Odds API, μία φορά τη μέρα λίγο πριν από τους αγώνες της νύχτας.
# Κόστος: 3 credits ανά κλήση (~93 τον μήνα, από τα 500 δωρεάν που μοιράζεται με την EuroLeague).
name: NBA αποδόσεις

on:
  schedule:
    - cron: "15 22 * * *"   # 00:15 ώρα Ελλάδας τον χειμώνα: πριν από τα περισσότερα τζάμπολ (00:00–03:30 UTC)
  push:
    branches: [nba-odds]    # δοκιμαστική εκτέλεση στο branch πριν από το merge
    paths: [scripts/nba-odds.mjs, .github/workflows/nba-odds.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Αποδόσεις NBA
        env:
          ODDS_API_KEY: ${{ secrets.THEODDSAPI_KEY }}
        run: node scripts/nba-odds.mjs
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          [ -d data/nba/odds ] && git add data/nba/odds
          git diff --cached --quiet || (git commit -m "NBA: αποδόσεις $(date -u +%F-%H%M)" && for i in 1 2 3 4; do git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 15; git pull --rebase -q origin "${GITHUB_REF_NAME}"; done)
