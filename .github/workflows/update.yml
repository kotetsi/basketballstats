# Κάθε βράδυ: τραβάει νέα δεδομένα από την EuroLeague, ξαναχτίζει τις σελίδες
# και τις δημοσιεύει στο GitHub Pages. Τρέχει και όταν αλλάζει κάτι στο repo
# (π.χ. νέο άρθρο) και χειροκίνητα από την καρτέλα Actions.
name: Ενημέρωση site

on:
  schedule:
    - cron: "15 0 * * *"    # 02:15 ώρα Ελλάδας τον χειμώνα (03:15 το καλοκαίρι)
    - cron: "0 15 * * 2-5"  # και πριν από τους αγώνες (Τρίτη-Παρασκευή, 17:00 ώρα Ελλάδας): φρέσκες προβλέψεις Fantasy
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fantasy/requirements.txt
      - name: Βιβλιοθήκες για το μοντέλο Fantasy
        run: pip install -r fantasy/requirements.txt
      - name: Λήψη δεδομένων και παραγωγή σελίδων
        run: node build.mjs
      - name: Προβλέψεις PIR για το Fantasy (αν αποτύχει, το site βγαίνει κανονικά χωρίς αυτές)
        run: python fantasy/run.py || echo "Fantasy: παραλείφθηκε"
      - name: Ξανά οι σελίδες, με τις προβλέψεις
        run: node build.mjs --offline
      - name: Αποθήκευση των νέων δεδομένων στο repo
        run: |
          git config user.name "basketballstats-bot"
          git config user.email "basketballstats-bot@users.noreply.github.com"
          git add data/cache.json data/fantasy
          git diff --cached --quiet || (git commit -m "Ενημέρωση δεδομένων $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
