# Κάθε βράδυ: τραβάει νέα δεδομένα από την EuroLeague, ξαναχτίζει τις σελίδες
# και τις δημοσιεύει στο GitHub Pages. Τρέχει και όταν αλλάζει κάτι στο repo
# (π.χ. νέο άρθρο) και χειροκίνητα από την καρτέλα Actions.
name: Ενημέρωση site

on:
  schedule:
    - cron: "15 0 * * *"    # 02:15 ώρα Ελλάδας τον χειμώνα (03:15 το καλοκαίρι)
    - cron: "0 15 * * 2-5"  # και πριν από τους αγώνες (Τρίτη-Παρασκευή, 17:00 ώρα Ελλάδας): φρέσκες προβλέψεις Fantasy
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Fantasy model rollback: έκδοση μοντέλου (π.χ. pir-2stage-v1). Κενό = καμία αλλαγή."
        required: false
        default: ""
      odds_force:
        description: "Αποδόσεις: νέα λήψη για όλους τους επόμενους αγώνες τώρα (π.χ. για player props). ~1 κλήση ανά αγώνα."
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fantasy/requirements.txt
      - name: Μοντέλα μετάφρασης (Argos, αποθηκεύονται για τις επόμενες εκτελέσεις)
        uses: actions/cache@v4
        with:
          path: ~/.cache/bs-argos
          key: argos-models-v1
      - name: Βιβλιοθήκες για το μοντέλο Fantasy
        run: pip install -r fantasy/requirements.txt -r predictor/requirements.txt
      - name: Unit tests (on/off, lineups, δείκτες, Game Predictor, simulator)
        run: node --test test/assistant.test.mjs test/dom.test.mjs test/press.test.mjs test/perf.test.mjs test/live.test.mjs test/insight.test.mjs test/optimizer.test.mjs test/fantasy-strategy.test.mjs test/fantasy-manager.test.mjs src/game/wp.test.mjs test/analytics.test.mjs test/matchup.test.mjs test/shots.test.mjs test/compare.test.mjs test/compare-v2.test.mjs test/odds.test.mjs test/props.test.mjs test/odds-value.test.mjs && python -m unittest predictor/test_predictor.py && python -m unittest fantasy/tests/test_perf.py fantasy/tests/test_translate.py
      - name: Λήψη δεδομένων και παραγωγή σελίδων
        run: node build.mjs
      - name: Play-by-play → lineups και on/off (μόνο οι νέοι αγώνες)
        run: timeout 1200 node scripts/pbp.mjs --keys --secs 600 || echo "PBP - παραλείφθηκε"
      - name: "Shot charts - συντεταγμένες σουτ (μόνο οι νέοι αγώνες)"
        run: timeout 900 node scripts/shots.mjs --secs 480 || echo "Shots - παραλείφθηκε"
      - name: Fantasy model rollback (μόνο αν δόθηκε έκδοση στο Run workflow)
        if: github.event.inputs.rollback_to != ''
        env:
          ROLLBACK_TO: ${{ github.event.inputs.rollback_to }}
        run: python fantasy/perf_run.py --rollback "$ROLLBACK_TO" --reason "GitHub Actions workflow_dispatch"
      - name: Προβλέψεις PIR για το Fantasy (αν αποτύχει, το site βγαίνει κανονικά χωρίς αυτές)
        run: python fantasy/run.py || echo "Fantasy - παραλείφθηκε" && (python fantasy/backfill.py || echo "fantasy backfill - σφάλμα")
      - name: "Fantasy model performance - ιστορικές σεζόν (μία φορά), walk-forward backtest, optimizer backtest"
        run: |
          timeout 1500 node fantasy/hist_fetch.mjs || echo "hist_fetch - σφάλμα"
          timeout 2700 python fantasy/perf_run.py || echo "perf_run - σφάλμα"
          timeout 1500 node fantasy/optbt.mjs || echo "optbt - σφάλμα"
      - name: "Ειδήσεις τύπου (RSS, μόνο τίτλοι + links) και λεπτά στην ABA"
        run: |
          timeout 120 node fantasy/press_fetch.mjs || echo "press - σφάλμα"
          timeout 300 node fantasy/dom_fetch.mjs || echo "dom - σφάλμα"
          timeout 900 python fantasy/translate_heads.py || echo "translate - σφάλμα"
      - name: "Αποδόσεις από αδειοδοτημένο πάροχο (μόνο αν υπάρχει ODDS_API_KEY)"
        id: odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_PROVIDER: ${{ vars.ODDS_PROVIDER }}
        run: node scripts/odds.mjs ${{ github.event.inputs.odds_force == 'true' && '--force' || '' }}; echo "rc=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: "Alert: το feed αποδόσεων σταμάτησε"
        if: steps.odds.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "Odds feed stale" --json number -q '.[0].number' | grep -q . || gh issue create --title "Odds feed stale" --body "Το feed αποδόσεων δεν ενημερώθηκε για >30 ώρες. Δες το log του workflow και το data/odds/status.json."
      - name: Game Predictor (LightGBM, backtest, προβλέψεις επόμενων αγώνων)
        run: python predictor/run.py || echo "Game Predictor - παραλείφθηκε"
      - name: Ξανά οι σελίδες, με τις προβλέψεις
        run: node build.mjs --offline
      - name: Έλεγχος SEO (στατική βαθμολογία και δεδομένα αγώνων)
        run: node --test test/seo.test.mjs
      - name: "Έλεγχος σελίδας Σύγκρισης στον browser (επιλογές, φίλτρα, URLs, SEO, κινητό)"
        # δεν μπλοκάρει την ημερήσια ενημέρωση δεδομένων· μια αποτυχία φαίνεται ως κόκκινο βήμα στο run
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node test/e2e/compare-ui.e2e.mjs
      - name: "Έλεγχος σελίδας Odds & Value Bets στον browser (φίλτρα, .gr σύνδεσμοι, κινητό)"
        # δεν μπλοκάρει την ημερήσια ενημέρωση δεδομένων· μια αποτυχία φαίνεται ως κόκκινο βήμα στο run
        continue-on-error: true
        run: node test/e2e/odds-value.e2e.mjs   # το playwright εγκαταστάθηκε στο προηγούμενο βήμα
      - name: Αναρτήσεις στο κανάλι Telegram (μόνο αν υπάρχουν τα secrets)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: "@eubasketballstats_eu"
          TELEGRAM_TIPSTERS: "high-fidelity"     # νέα picks → κανάλι
          TELEGRAM_ROUNDS: "0"                   # 1 = και προεπισκόπηση/αποτελέσματα αγωνιστικής
        run: node scripts/telegram.mjs || true
      - name: Κάρτες εικόνας για τα ανοιχτά picks (Instagram/Facebook)
        continue-on-error: true
        run: |
          node -e "require.resolve('playwright')" 2>/dev/null || npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
          node scripts/pick-cards.mjs
      - name: Αποθήκευση των νέων δεδομένων στο repo
        continue-on-error: true
        run: |
          git config user.name "basketballstats-bot"
          git config user.email "basketballstats-bot@users.noreply.github.com"
          git add data/cache.json data/fantasy; [ -f data/sitemap-lastmod.json ] && git add data/sitemap-lastmod.json; [ -d data/pbp ] && git add data/pbp; [ -d data/matchups ] && git add data/matchups; [ -d data/shots ] && git add data/shots; [ -d data/odds ] && git add data/odds; if [ -f data/telegram.json ]; then git add data/telegram.json; fi
          git diff --cached --quiet || (git commit -m "Ενημέρωση δεδομένων $(date -u +%F)" && for i in 1 2 3 4; do git push && break; sleep 15; git pull --rebase -q -X theirs || (git rebase --abort; git pull --no-rebase -q -X ours --no-edit); done)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # ~16.000 σελίδες: ο συγχρονισμός αρχείων μπορεί να ξεπεράσει τα 10 λεπτά (προεπιλογή)

  # Αναρτήσεις νέων picks σε Facebook/Instagram ΜΕΤΑ το deploy (το Instagram διαβάζει την κάρτα από το δημόσιο URL).
  # Χωρίς το secret META_PAGE_TOKEN δεν κάνει τίποτα.
  social:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Αναρτήσεις Facebook / Instagram
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: "1372786612592081"      # Σελίδα BasketballStats.eu (δημόσιο id)
          IG_USER_ID: "17841438627851733"     # Instagram @basketballstats.eu (δημόσιο id)
          SOCIAL_TIPSTERS: "high-fidelity"
        run: node scripts/social.mjs || true
      - name: Αποθήκευση (τι αναρτήθηκε)
        run: |
          [ -f data/social.json ] || exit 0
          git config user.name "basketballstats-bot"; git config user.email "basketballstats-bot@users.noreply.github.com"
          git add data/social.json
          git diff --cached --quiet || (git commit -m "Social: αναρτήσεις picks" && for i in 1 2 3 4; do git push && break; sleep 10; git pull --rebase -q; done)
