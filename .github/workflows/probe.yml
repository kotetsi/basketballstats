name: Probe PBP
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o pbp.json "https://live.euroleague.net/api/PlayByPlay?gamecode=1&seasoncode=E2026"
          curl -s -o box.json "https://live.euroleague.net/api/Boxscore?gamecode=1&seasoncode=E2026"
          echo "KEYS"; jq -c 'keys' pbp.json
          jq -c '[.FirstQuarter[0:25][] ]' pbp.json
          echo "Q2START"; jq -c '[.SecondQuarter[0:12][]]' pbp.json
          echo "TYPES"; jq -c '[.FirstQuarter[],.SecondQuarter[],.ThirdQuarter[],.ForthQuarter[]|.PLAYTYPE]|group_by(.)|map({(.[0]):length})|add' pbp.json
          echo "BOX"; jq -c 'keys' box.json; jq -c '.Stats[0]|keys' box.json; jq -c '.Stats[0].PlayersStats[0]' box.json
