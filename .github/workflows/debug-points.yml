name: debug-points
on: workflow_dispatch
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://live.euroleague.net/api/Points?gamecode=113&seasoncode=E2026" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin)['Rows']:
              if 'VEZENKOV' in r.get('PLAYER','') : print(r.get('MINUTE'),r.get('CONSOLE'),r.get('ID_ACTION'),r.get('COORD_X'),r.get('COORD_Y'),r.get('ZONE'),r.get('UTC'))"
