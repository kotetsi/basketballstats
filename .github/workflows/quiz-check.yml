name: EuroLeague Quiz checks

on:
  push:
    branches: [feature/euroleague-quiz]
  pull_request:
    branches: [main]
    paths:
      - 'build.mjs'
      - 'src/quiz/**'
      - 'src/compare/metrics.mjs'
      - 'test/quiz.test.mjs'
      - 'test/e2e/quiz.e2e.mjs'
      - '.github/workflows/quiz-check.yml'

permissions:
  contents: read

concurrency:
  group: quiz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/quiz.test.mjs
      - run: node build.mjs --offline
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/quiz.e2e.mjs
