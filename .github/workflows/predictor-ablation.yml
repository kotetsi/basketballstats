# Σύγκριση εκδοχών του Game Predictor (walk-forward backtest), μόνο για ανάλυση: δεν αλλάζει τίποτα στο repo.
name: Game Predictor - σύγκριση εκδοχών
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "προσέγγιση ζευγών λ=1500 (τρέχον)", env: "" }
          - { label: "ακριβή ζεύγη λ=1500", env: "PRED_RAPM_MU=1" }
          - { label: "ακριβή ζεύγη λ=1000", env: "PRED_RAPM_MU=1 PRED_RAPM_LAMBDA=1000" }
          - { label: "ακριβή ζεύγη λ=2500", env: "PRED_RAPM_MU=1 PRED_RAPM_LAMBDA=2500" }
          - { label: "ακριβή ζεύγη λ=4000", env: "PRED_RAPM_MU=1 PRED_RAPM_LAMBDA=4000" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: fantasy/requirements.txt }
      - run: pip install -r fantasy/requirements.txt -r predictor/requirements.txt
      - run: env ${{ matrix.env }} python predictor/ablation.py "${{ matrix.label }}"
