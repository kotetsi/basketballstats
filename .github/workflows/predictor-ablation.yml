# Σύγκριση εκδοχών του Game Predictor (walk-forward backtest), μόνο για ανάλυση: δεν αλλάζει τίποτα στο repo.
name: Game Predictor - σύγκριση εκδοχών
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "τρέχον (RAPM πεντάδων με box-score prior)", env: "" }
          - { label: "χωρίς RAPM πεντάδων", env: "PRED_LINEUPS=0" }
          - { label: "RAPM χωρίς box-score prior", env: "PRED_RAPM_PRIOR=0" }
          - { label: "RAPM λ=1500", env: "PRED_RAPM_LAMBDA=1500" }
          - { label: "RAPM λ=6000", env: "PRED_RAPM_LAMBDA=6000" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: predictor/requirements.txt }
      - run: pip install -r predictor/requirements.txt
      - run: env ${{ matrix.env }} python predictor/ablation.py "${{ matrix.label }}"
