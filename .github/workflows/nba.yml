# NBA: κάθε πρωί (μετά τους αγώνες της νύχτας) κατεβάζει πρόγραμμα, αποτελέσματα, box scores και σουτ από το ESPN
# στο data/nba. Δεν χτίζει σελίδες· αυτό το κάνει η «Ενημέρωση site».
name: NBA δεδομένα

on:
  schedule:
    - cron: "40 7 * * *"    # 09:40 ώρα Ελλάδας τον χειμώνα: έχουν τελειώσει όλοι οι αγώνες της νύχτας
  push:
    branches: [nba-data, nba-backfill, oos-nba-dashboard]    # δοκιμαστική εκτέλεση στο branch πριν από το merge
    paths: [src/nba/**, scripts/nba.mjs, scripts/nba-espn-odds.mjs, scripts/nba-calib.mjs, predictor/nba.py, .github/workflows/nba.yml]
  workflow_dispatch:
    inputs:
      max:
        description: "Μέγιστος αριθμός νέων αγώνων σε αυτή την εκτέλεση"
        required: false
        default: "300"
      from:
        description: "Από (YYYYMMDD), για παλιά σεζόν π.χ. 20251021"
        required: false
        default: "20261020"
      to:
        description: "Έως (YYYYMMDD), κενό = σήμερα + 21 μέρες"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nba-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Τεστ parser
        run: node --test test/nba-espn.test.mjs
      - name: Λήψη από το ESPN
        run: node scripts/nba.mjs --max "${{ github.event.inputs.max || '300' }}" --from "${{ github.event.inputs.from || '20261020' }}" ${{ github.event.inputs.to && format('--to {0}', github.event.inputs.to) || '' }}
      - name: Ιστορικές γραμμές (ESPN BET) για τη μέτρηση έναντι της αγοράς
        continue-on-error: true
        run: node scripts/nba-espn-odds.mjs --max 2000
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fantasy/requirements.txt
            predictor/requirements.txt
      - name: Μοντέλο NBA (backtest + προβλέψεις)
        continue-on-error: true   # τα δεδομένα αποθηκεύονται ακόμα κι αν αποτύχει το μοντέλο
        run: |
          pip install -q -r fantasy/requirements.txt -r predictor/requirements.txt
          python predictor/nba.py
          node scripts/nba-market-eval.mjs
          node scripts/nba-proj-eval.mjs
          node scripts/nba-calib.mjs --json data/nba/model/calib.json
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          [ -d data/nba ] && git add data/nba
          git diff --cached --quiet || (git commit -m "NBA: δεδομένα $(date -u +%F)" && for i in 1 2 3 4; do git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 15; git pull --rebase -q origin "${GITHUB_REF_NAME}"; done)
